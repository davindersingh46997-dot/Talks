services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agents_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agents_frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: agents_postgres

    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: